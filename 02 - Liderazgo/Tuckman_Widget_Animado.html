<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etapas de formación de un equipo — Modelo de Tuckman</title>
<style>
  :root{
    --navy:#1A2B5F; --navy2:#24356B; --navy3:#0F1C3F;
    --teal:#028090; --teal2:#00A896; --amber:#F59E0B; --coral:#E05C47;
    --off:#F4F6FA; --ink:#1E293B; --gray:#94A3B8; --line:#2C3E6B;
    --card:#1E2E5E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',Calibri,system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 700px at 70% -10%, #22346e 0%, var(--navy) 45%, var(--navy3) 100%);
    color:#fff; min-height:100vh; display:flex; flex-direction:column;
    padding:22px clamp(16px,3vw,44px);
  }
  .wrap{max-width:1180px; width:100%; margin:0 auto; display:flex; flex-direction:column; flex:1;}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  header h1{font-family:Cambria,Georgia,serif; font-size:clamp(20px,2.4vw,30px); font-weight:700; letter-spacing:.2px;}
  header .sub{font-size:13px; color:var(--teal2); text-transform:uppercase; letter-spacing:3px; font-weight:600;}

  /* chart */
  .chart-card{background:rgba(15,28,63,.55); border:1px solid var(--line); border-radius:14px; padding:14px 12px 6px; position:relative;}
  svg{display:block; width:100%; height:auto;}
  .axis-lbl{fill:var(--gray); font-size:12px; letter-spacing:1px;}
  .grid{stroke:rgba(255,255,255,.06); stroke-width:1;}
  .band{opacity:.10;}
  .band.active{opacity:.22;}
  .curve-bg{fill:none; stroke:rgba(255,255,255,.12); stroke-width:3;}
  .curve{fill:none; stroke:var(--teal2); stroke-width:4.5; stroke-linecap:round;
         filter:drop-shadow(0 0 6px rgba(0,168,150,.5));}
  .dot{filter:drop-shadow(0 0 8px rgba(245,158,11,.8));}
  .dot-halo{opacity:.35;}
  .stage-tick{fill:var(--gray); font-size:12.5px; font-weight:600;}
  .floatlbl{fill:#fff; font-size:15px; font-weight:700;}
  .floatlbl-en{fill:var(--gray); font-size:12px; font-style:italic;}

  /* cards strip */
  .cards{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:14px 0;}
  .scard{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:11px 10px;
         cursor:pointer; transition:transform .18s ease, box-shadow .18s ease, border-color .18s; text-align:left;
         border-top:3px solid var(--stage);}
  .scard:hover{transform:translateY(-2px);}
  .scard.active{transform:translateY(-4px); box-shadow:0 10px 26px rgba(0,0,0,.4); border-color:var(--stage);
                background:linear-gradient(180deg, color-mix(in srgb, var(--stage) 22%, var(--card)) 0%, var(--card) 70%);}
  .scard .num{font-family:Cambria,serif; font-size:13px; font-weight:700; color:var(--stage);}
  .scard .es{font-family:Cambria,serif; font-size:clamp(13px,1.4vw,17px); font-weight:700; margin-top:2px; line-height:1.1;}
  .scard .en{font-size:11.5px; color:var(--gray); font-style:italic; margin-top:1px;}
  .scard .verb{margin-top:7px; font-size:11px; letter-spacing:.5px; color:#e8eef7;}
  .scard .verb b{color:var(--stage); font-size:13px;}

  /* detail */
  .detail{background:rgba(30,46,94,.6); border:1px solid var(--line); border-left:5px solid var(--stage);
          border-radius:12px; padding:16px 20px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px 26px;}
  .detail .field h3{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--stage); margin-bottom:4px; font-weight:700;}
  .detail .field p{font-size:14.5px; line-height:1.35; color:#eef2fa;}
  .detail .field .en{font-size:12px; color:var(--gray); font-style:italic; margin-top:3px;}
  .detail-head{grid-column:1/-1; display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:2px;}
  .detail-head .t{font-family:Cambria,serif; font-size:22px; font-weight:700;}
  .detail-head .en{font-size:14px; color:var(--gray); font-style:italic;}
  .detail-head .badge{margin-left:auto; background:var(--stage); color:#fff; font-size:12px; font-weight:700;
                      padding:4px 12px; border-radius:20px; letter-spacing:.5px;}

  /* controls */
  .controls{display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap;}
  button.ctrl{background:var(--navy2); color:#fff; border:1px solid var(--line); border-radius:9px;
              padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:background .15s, transform .1s;
              display:inline-flex; align-items:center; gap:7px;}
  button.ctrl:hover{background:var(--teal); border-color:var(--teal);}
  button.ctrl:active{transform:scale(.97);}
  button.ctrl.primary{background:var(--teal); border-color:var(--teal); min-width:118px; justify-content:center;}
  button.ctrl.primary:hover{background:var(--teal2); border-color:var(--teal2);}
  .spacer{flex:1;}
  .prog-wrap{display:flex; align-items:center; gap:10px; flex:1; min-width:220px;}
  input[type=range]{-webkit-appearance:none; appearance:none; height:6px; border-radius:6px; background:var(--line); flex:1; cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--amber); cursor:pointer; box-shadow:0 0 6px rgba(245,158,11,.7);}
  input[type=range]::-moz-range-thumb{width:16px; height:16px; border:none; border-radius:50%; background:var(--amber); cursor:pointer;}
  .hint{font-size:11.5px; color:var(--gray); text-align:center; margin-top:12px;}
  .hint kbd{background:var(--navy2); border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-size:11px;}
  .foot{font-size:11px; color:var(--gray); font-style:italic; margin-top:8px; text-align:center;}
  @media(max-width:820px){
    .detail{grid-template-columns:1fr;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .scard:last-child{grid-column:1/-1;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Etapas de formación de un equipo</h1>
    <span class="sub">Modelo de Tuckman</span>
  </header>

  <div class="chart-card">
    <svg id="chart" viewBox="0 0 1000 440" role="img" aria-label="Curva de efectividad del equipo a lo largo de las cinco etapas de Tuckman.">
      <!-- bands, grid, curve, dot injected/placed by JS + static markup -->
      <g id="bands"></g>
      <g id="grid"></g>
      <!-- axis labels -->
      <text class="axis-lbl" x="20" y="30" transform="rotate(-90 20 30)" style="text-anchor:end;">EFECTIVIDAD →</text>
      <text class="axis-lbl" x="930" y="428" style="text-anchor:end;">TIEMPO →</text>
      <path id="curveBg" class="curve-bg" d=""></path>
      <path id="curve" class="curve" d=""></path>
      <g id="ticks"></g>
      <circle id="halo" class="dot-halo" r="16" fill="#F59E0B"></circle>
      <circle id="dot" class="dot" r="8" fill="#F59E0B" stroke="#fff" stroke-width="2"></circle>
      <g id="floating"></g>
    </svg>
  </div>

  <div class="cards" id="cards"></div>

  <div class="detail" id="detail"></div>

  <div class="controls">
    <button class="ctrl" id="prev" title="Etapa anterior (←)">◀</button>
    <button class="ctrl primary" id="play" title="Reproducir / Pausar (Espacio)">▶ Reproducir</button>
    <button class="ctrl" id="next" title="Etapa siguiente (→)">▶</button>
    <button class="ctrl" id="reset" title="Reiniciar (R)">↺ Reiniciar</button>
    <div class="prog-wrap">
      <input type="range" id="scrub" min="0" max="1000" value="0">
    </div>
  </div>

  <div class="hint">
    <kbd>Espacio</kbd> reproducir/pausar &nbsp;·&nbsp; <kbd>←</kbd> <kbd>→</kbd> cambiar etapa &nbsp;·&nbsp; <kbd>R</kbd> reiniciar &nbsp;·&nbsp; clic en una etapa para saltar
  </div>
  <div class="foot">La curva de efectividad es una ilustración pedagógica, no un dato empírico. Tuckman (1965) definió 4 etapas; Disolución se agregó con Jensen (1977).</div>
</div>

<script>
// ---- Data ----------------------------------------------------------------
const STAGES = [
  { n:1, es:"Formación", en:"Forming", color:"#3B62B5",
    clima:["Cortesía, entusiasmo cauto y dependencia del líder.","Politeness, cautious enthusiasm, dependence on the leader."],
    foco:["Conocerse, entender la tarea y buscar pertenencia.","Getting acquainted, understanding the task, seeking belonging."],
    lider:["Dar dirección, estructura y objetivos claros.","Give direction, structure and clear goals."],
    verb:"Dirigir", verbEn:"Direct" },
  { n:2, es:"Tormenta", en:"Storming", color:"#E05C47",
    clima:["Conflicto, choque de roles y expectativas.","Conflict, clashing roles and expectations."],
    foco:["Posicionamiento, tensión por poder y roles.","Positioning, tension over power and roles."],
    lider:["Sostener el conflicto de ideas; mediar, no apagarlo.","Hold the conflict of ideas; mediate, don't suppress it."],
    verb:"Mediar", verbEn:"Mediate" },
  { n:3, es:"Normalización", en:"Norming", color:"#F59E0B",
    clima:["Acuerdos, cohesión y normas compartidas.","Agreements, cohesion and shared norms."],
    foco:["Colaboración y confianza creciente.","Collaboration and growing trust."],
    lider:["Soltar control y reforzar las normas del equipo.","Loosen control and reinforce team norms."],
    verb:"Facilitar", verbEn:"Facilitate" },
  { n:4, es:"Desempeño", en:"Performing", color:"#028090",
    clima:["Autonomía y foco en los resultados.","Autonomy and focus on results."],
    foco:["Alto rendimiento y autogestión.","High performance and self-management."],
    lider:["Remover obstáculos y desarrollar a las personas.","Remove obstacles and develop people."],
    verb:"Delegar", verbEn:"Delegate" },
  { n:5, es:"Disolución", en:"Adjourning", color:"#00A896",
    clima:["Cierre, reconocimiento y cierta nostalgia.","Closure, recognition and some nostalgia."],
    foco:["Transferir aprendizaje y cerrar bien.","Transfer learning and close well."],
    lider:["Reconocer los logros y transferir el aprendizaje.","Recognize achievements and transfer learning."],
    verb:"Cerrar", verbEn:"Close" },
];
// stage bands as x-fraction [start,end]
const BANDS = [[0,0.18],[0.18,0.42],[0.42,0.63],[0.63,0.90],[0.90,1.0]];

// effectiveness control points (xfrac, value 0..100)
const PTS = [
  [0.00,44],[0.09,50],[0.16,47],
  [0.24,40],[0.31,24],[0.40,30],
  [0.48,44],[0.57,58],
  [0.66,71],[0.75,84],[0.86,90],
  [0.92,84],[1.00,66]
];

// ---- Geometry ------------------------------------------------------------
const PL = {x0:70, x1:950, yTop:40, yBot:380}; // plot area
const fx = f => PL.x0 + f*(PL.x1-PL.x0);
const fy = v => PL.yBot - (v/100)*(PL.yBot-PL.yTop);

// Catmull-Rom -> cubic bezier smooth path
function smoothPath(points){
  const p = points.map(([f,v])=>[fx(f),fy(v)]);
  let d = `M ${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

const SVG = document.getElementById('chart');
const curve = document.getElementById('curve');
const curveBg = document.getElementById('curveBg');
const dPath = smoothPath(PTS);
curve.setAttribute('d', dPath);
curveBg.setAttribute('d', dPath);
const L = curve.getTotalLength();
curve.style.strokeDasharray = L;
curve.style.strokeDashoffset = L;

// bands
const bandsG = document.getElementById('bands');
BANDS.forEach((b,i)=>{
  const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x',fx(b[0])); r.setAttribute('y',PL.yTop);
  r.setAttribute('width',fx(b[1])-fx(b[0])); r.setAttribute('height',PL.yBot-PL.yTop);
  r.setAttribute('fill',STAGES[i].color); r.setAttribute('class','band'); r.dataset.i=i;
  bandsG.appendChild(r);
});
// grid lines (horizontal)
const gridG=document.getElementById('grid');
[0,25,50,75,100].forEach(v=>{
  const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
  ln.setAttribute('x1',PL.x0); ln.setAttribute('x2',PL.x1);
  ln.setAttribute('y1',fy(v)); ln.setAttribute('y2',fy(v)); ln.setAttribute('class','grid');
  gridG.appendChild(ln);
});
// ticks (stage names under axis)
const ticksG=document.getElementById('ticks');
BANDS.forEach((b,i)=>{
  const cx=fx((b[0]+b[1])/2);
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',cx); t.setAttribute('y',408); t.setAttribute('class','stage-tick');
  t.setAttribute('text-anchor','middle'); t.textContent=STAGES[i].es;
  ticksG.appendChild(t);
});

// sample p->xfrac lookup for stage jumping
const SAMPLES=[];
for(let s=0;s<=600;s++){
  const p=s/600; const pt=curve.getPointAtLength(p*L);
  SAMPLES.push({p, f:(pt.x-PL.x0)/(PL.x1-PL.x0)});
}
function pForFrac(frac){
  for(const s of SAMPLES){ if(s.f>=frac) return s.p; }
  return 1;
}
function stageForFrac(frac){
  for(let i=0;i<BANDS.length;i++){ if(frac<BANDS[i][1]-1e-6) return i; }
  return BANDS.length-1;
}

// ---- Rendering active state ---------------------------------------------
const dot=document.getElementById('dot'), halo=document.getElementById('halo');
const floating=document.getElementById('floating');
const cardsEl=document.getElementById('cards'), detailEl=document.getElementById('detail');
const scrub=document.getElementById('scrub');
let activeIdx=-1;

// build cards
STAGES.forEach((st,i)=>{
  const c=document.createElement('button');
  c.className='scard'; c.style.setProperty('--stage',st.color); c.dataset.i=i;
  c.innerHTML=`<div class="num">Etapa ${st.n}</div>
    <div class="es">${st.es}</div><div class="en">${st.en}</div>
    <div class="verb">El líder: <b>${st.verb}</b></div>`;
  c.addEventListener('click',()=>jumpToStage(i));
  cardsEl.appendChild(c);
});

function renderDetail(i){
  const st=STAGES[i];
  detailEl.style.setProperty('--stage',st.color);
  detailEl.innerHTML=`
    <div class="detail-head">
      <span class="t">Etapa ${st.n} · ${st.es}</span>
      <span class="en">${st.en}</span>
      <span class="badge">El líder: ${st.verb}</span>
    </div>
    <div class="field"><h3>Clima</h3><p>${st.clima[0]}<span class="en">${st.clima[1]}</span></p></div>
    <div class="field"><h3>Foco del equipo</h3><p>${st.foco[0]}<span class="en">${st.foco[1]}</span></p></div>
    <div class="field"><h3>Rol del líder</h3><p>${st.lider[0]}<span class="en">${st.lider[1]}</span></p></div>`;
}
function setActive(i){
  if(i===activeIdx) return;
  activeIdx=i;
  [...cardsEl.children].forEach((c,k)=>c.classList.toggle('active',k===i));
  [...bandsG.children].forEach((b,k)=>b.classList.toggle('active',k===i));
  renderDetail(i);
  // floating label color
  floating.querySelectorAll('*').forEach(n=>n.remove());
}

function updateToProgress(p){
  p=Math.max(0,Math.min(1,p));
  curve.style.strokeDashoffset = L*(1-p);
  const pt=curve.getPointAtLength(p*L);
  dot.setAttribute('cx',pt.x); dot.setAttribute('cy',pt.y);
  halo.setAttribute('cx',pt.x); halo.setAttribute('cy',pt.y);
  const frac=(pt.x-PL.x0)/(PL.x1-PL.x0);
  const si=stageForFrac(frac);
  const st=STAGES[si];
  dot.setAttribute('fill',st.color); halo.setAttribute('fill',st.color);
  setActive(si);
  // floating stage label near the dot
  floating.innerHTML='';
  const above = pt.y>120;
  const ly = above ? pt.y-22 : pt.y+34;
  const t1=document.createElementNS('http://www.w3.org/2000/svg','text');
  t1.setAttribute('x',Math.min(Math.max(pt.x,120),880)); t1.setAttribute('y',ly);
  t1.setAttribute('class','floatlbl'); t1.setAttribute('text-anchor','middle');
  t1.textContent=st.es; floating.appendChild(t1);
  scrub.value=Math.round(p*1000);
}

// ---- Playback ------------------------------------------------------------
let playing=false, raf=null, prog=0, last=0;
const DURATION=15000; // ms full sweep
const playBtn=document.getElementById('play');

function tick(ts){
  if(!last) last=ts;
  const dt=ts-last; last=ts;
  if(playing){
    prog += dt/DURATION;
    if(prog>=1){ prog=1; pause(); }
    updateToProgress(prog);
  }
  raf=requestAnimationFrame(tick);
}
function play(){
  if(prog>=1){ prog=0; }
  playing=true; last=0; playBtn.innerHTML='❚❚ Pausar';
}
function pause(){ playing=false; playBtn.innerHTML='▶ Reproducir'; }
function toggle(){ playing?pause():play(); }

function jumpToStage(i){
  pause();
  const start=BANDS[i][0], end=BANDS[i][1];
  const mid=start+(end-start)*0.55;
  prog=pForFrac(mid);
  updateToProgress(prog);
}

document.getElementById('play').addEventListener('click',toggle);
document.getElementById('reset').addEventListener('click',()=>{pause();prog=0;updateToProgress(0);});
document.getElementById('next').addEventListener('click',()=>jumpToStage(Math.min(activeIdx+1,4)));
document.getElementById('prev').addEventListener('click',()=>jumpToStage(Math.max(activeIdx-1,0)));
scrub.addEventListener('input',e=>{pause();prog=e.target.value/1000;updateToProgress(prog);});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle();}
  else if(e.code==='ArrowRight'){jumpToStage(Math.min(activeIdx+1,4));}
  else if(e.code==='ArrowLeft'){jumpToStage(Math.max(activeIdx-1,0));}
  else if(e.key==='r'||e.key==='R'){pause();prog=0;updateToProgress(0);}
});

// init
updateToProgress(0);
raf=requestAnimationFrame(tick);
</script>
</body>
</html>
